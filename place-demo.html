<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Place Demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #04080f; color: rgba(255, 255, 255, 0.92); }
      #map { position: fixed; inset: 0; }
      .pd-side {
        position: fixed; z-index: 5; left: 14px; top: 14px; bottom: 96px; width: 344px; overflow-y: auto; overscroll-behavior: contain;
        padding: 18px 16px 16px; border-radius: 26px; background: rgba(28, 28, 30, 0.66);
        backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
        box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.14) inset, 0 24px 60px -18px rgba(0, 0, 0, 0.8);
        scrollbar-width: thin; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      .pd-side h2 { margin: 0 0 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: rgba(255, 255, 255, 0.95); }
      .pd-time {
        position: fixed; z-index: 5; left: 14px; right: 14px; bottom: 14px; height: 68px; display: flex; align-items: center; gap: 14px;
        padding: 0 18px; border-radius: 22px; background: rgba(28, 28, 30, 0.66);
        backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
        box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.14) inset, 0 24px 60px -18px rgba(0, 0, 0, 0.8);
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-variant-numeric: tabular-nums;
      }
      .pd-time button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: #0a84ff; color: #fff; cursor: pointer; display: grid; place-items: center; }
      .pd-time input { flex: 1; accent-color: #0a84ff; }
      .pd-time output { min-width: 190px; color: rgba(235, 235, 245, 0.75); }
      .pd-status { position: fixed; z-index: 6; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(28, 28, 30, 0.8); font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: rgba(235, 235, 245, 0.8); }
      .pd-status:empty { display: none; }
      @media (max-width: 720px) {
        .pd-side { left: 8px; right: 8px; width: auto; top: auto; bottom: 88px; max-height: 58vh; }
        .pd-time { left: 8px; right: 8px; bottom: 8px; }
        .pd-time output { min-width: 0; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside class="pd-side" aria-label="Your place">
      <h2>Your place</h2>
      <div id="place-mount"></div>
    </aside>
    <div class="pd-time">
      <button id="play" type="button" aria-label="Play">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5L7 4.5Z" /></svg>
      </button>
      <input id="hour" type="range" min="0" max="0" step="1" value="0" aria-label="Hour of the simulation" />
      <output id="hourv" for="hour"></output>
    </div>
    <div class="pd-status" id="status" role="status">Loading map data…</div>
    <script type="module" src="/src/place/placeDemo.ts"></script>
  </body>
</html>

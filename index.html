<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5s7 7.4 7 12.3A7 7 0 0 1 5 14.8C5 9.9 12 2.5 12 2.5Z' fill='%231ec8ff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hour-by-hour flood outlook for Rajarajeshwari Nagar (560098), Bengaluru: low-lying areas, rain forecast and what flooding means for roads, schools, hospitals and homes." />
    <title>560098 Flood Outlook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map" aria-label="3D flood map of Rajarajeshwari Nagar"></div>

    <aside class="panel left" id="left" aria-label="Rain and settings"></aside>
    <aside class="panel right" id="right" aria-label="Impact"></aside>
    <footer class="panel timeline" id="timeline" aria-label="Timeline"></footer>

    <button class="drawer-btn left" id="open-left" aria-controls="left" aria-label="Show rain and settings"></button>
    <button class="drawer-btn right" id="open-right" aria-controls="right" aria-label="Show impact"></button>

    <div class="tip" id="tip" role="tooltip" hidden></div>

    <div id="loader" class="loader">
      <div class="ld-inner">
        <div class="ld-pin">560098</div>
        <div class="ld-name">Rajarajeshwari Nagar flood outlook</div>
        <div class="ld-bar"><i></i></div>
        <div class="ld-row"><span class="ld-msg">Starting</span><span class="ld-pct">0%</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

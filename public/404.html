<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bengaluru Flood Explorer</title>
    <script>
      // GitHub Pages serves this for any unknown path under the site (e.g. /Logged/560034 or
      // /Logged/index). The app is one page: send the visitor there, keeping the query string, and
      // turn a trailing 6-digit pincode into ?pin=<code>.
      (function () {
        var seg = location.pathname.split('/').filter(Boolean);
        var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/';
        var pin = location.pathname.match(/(\d{6})\/?$/);
        var q = new URLSearchParams(location.search);
        if (pin) q.set('pin', pin[1]);
        var s = q.toString();
        location.replace(base + (s ? '?' + s : '') + location.hash);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060b14; color: #ebebf5; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
      a { color: #64d2ff; }
    </style>
  </head>
  <body>
    <p>Opening the <a href="./">Bengaluru flood explorer</a>…</p>
  </body>
</html>

# Builds the app plus every Bengaluru Urban pincode pack and publishes them to GitHub Pages
# (https://achyuta0001.github.io/Logged/). The packs live only in the published site, never in git.
# Deploys on every push to `main` (merged pull requests) or `deploy` (git push origin HEAD:deploy),
# by hand, and monthly: at 02:17 UTC on the 1st a scheduled run rebuilds `main` with fresh OSM packs
# and roads (the cache keys below carry the UTC month, so a new month misses them and builds in full).
# Only `main` deploys on the schedule. GitHub pauses schedules after 60 days without repository activity.
#
# Pack cache. Building the packs (OSM extract, data:city, data:all) takes most of the run, so the
# result is cached (actions/cache) under "packs-v1-<UTC month>-<hash>". The hash covers what shapes a
# pack: scripts/build-*.mjs, scripts/lib/**, public/data/hotspots-city.json (the sourced flood spots
# copied into each pack), the src modules the builders import (src/pack/**, src/terrain.ts,
# src/region/packs.ts for hotspotsInBBox, src/sim/core.ts for lakeFreeboardM) and package-lock.json.
# The month makes OSM data refresh at least monthly.
#   - Same month and inputs: the packs, index.json and city.geojson come from the cache, and the OSM
#     download and every pack build are skipped. A copy or app change deploys in a few minutes.
#   - Otherwise (new month, a builder or its inputs changed, or no entry yet): the full build runs, and
#     its packs are saved once the tests pass.
#   - Run by hand with "rebuild" ticked to force a full build; its entry is newer, so later runs use it.
#   - Run by hand with "pins" to build and publish only those packs; the cache is neither read nor written.
# Bump "packs-v1" to drop every entry (e.g. after changing the OSM extract step below).
# Caches made on main serve every branch; caches made on `deploy` serve only `deploy`.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, deploy]
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:
    inputs:
      pins:
        description: 'Comma-separated pincodes (empty = all)'
        required: false
        default: ''
      rebuild:
        description: 'Rebuild every pack, ignoring the pack cache'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # a scheduled run builds the default branch; deploy it only when that is main
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack cache key
        id: packs-key
        run: echo "prefix=packs-v1-$(date -u +%Y-%m)-${{ hashFiles('scripts/build-*.mjs', 'scripts/lib/**', 'public/data/hotspots-city.json', 'src/pack/**', '!src/pack/__tests__/**', 'src/terrain.ts', 'src/region/packs.ts', 'src/sim/core.ts', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"
      # Every entry gets a unique key (prefix + run), so the newest entry for this prefix is restored
      # and a forced rebuild can replace an older one.
      - name: Restore built packs
        id: packs-cache
        if: ${{ !inputs.pins && !inputs.rebuild }}
        uses: actions/cache/restore@v6
        with:
          path: |
            public/data/pins
            public/data/city
            .cache/pins/catalog.json
          key: ${{ steps.packs-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.packs-key.outputs.prefix }}-
      # City road graph for commute routing (public/data/roads, ~6.5 MB gzipped, not in git): cached per
      # UTC month and builder like the packs; a miss rebuilds it from the OSM extract below in ~5 s.
      - name: Road graph cache key
        id: roads-key
        run: echo "key=roads-v1-$(date -u +%Y-%m)-${{ hashFiles('scripts/route/build-graph.mjs', 'src/route/config.ts', 'src/route/format.ts') }}" >> "$GITHUB_OUTPUT"
      - name: Restore road graph
        id: roads-cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v6
        with:
          path: public/data/roads
          key: ${{ steps.roads-key.outputs.key }}
      # the committed sample packs win over their cached copies; index.json then lists what is on disk
      - name: Committed packs, then refresh index.json
        if: steps.packs-cache.outputs.cache-matched-key != ''
        run: |
          echo "packs from cache entry ${{ steps.packs-cache.outputs.cache-matched-key }}"
          git checkout -- public/data/pins ':!public/data/pins/index.json'
          node scripts/build-city.mjs --index-only
      - name: osmium-tool
        if: steps.packs-cache.outputs.cache-matched-key == '' || steps.roads-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      # Geofabrik's India southern zone (~560 MB, ODbL) is far quicker than streaming the planet.
      - name: OSM extract for Bengaluru Urban
        if: steps.packs-cache.outputs.cache-matched-key == '' || steps.roads-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/osm
          curl -sSfL -A "Logged flood explorer (github.com/achyuta0001/Logged)" -o .cache/osm/southern-zone.osm.pbf \
            https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf
          osmium extract -b 77.15,12.45,78.05,13.45 -s smart .cache/osm/southern-zone.osm.pbf -o .cache/osm/blr-region.osm.pbf --overwrite
          rm .cache/osm/southern-zone.osm.pbf
          printf '{"source":"%s","bbox":"%s","built":"%s","licence":"ODbL 1.0, (c) OpenStreetMap contributors"}\n' \
            "https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf" "77.15,12.45,78.05,13.45" "$(date -u +%FT%TZ)" > .cache/osm/blr-region.json
      - name: Road graph
        if: steps.roads-cache.outputs.cache-hit != 'true'
        run: npm run data:roads
      - if: steps.packs-cache.outputs.cache-matched-key == ''
        run: npm run data:city
      - if: steps.packs-cache.outputs.cache-matched-key == ''
        run: npm run data:all -- --jobs 2 ${{ inputs.pins && format('--pins {0}', inputs.pins) || '' }}
      - run: npm test
      - name: Save built packs
        if: ${{ steps.packs-cache.outputs.cache-matched-key == '' && !inputs.pins }}
        uses: actions/cache/save@v6
        with:
          path: |
            public/data/pins
            public/data/city
            .cache/pins/catalog.json
          key: ${{ steps.packs-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save road graph
        if: steps.roads-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: public/data/roads
          key: ${{ steps.roads-key.outputs.key }}
      - run: npx vite build --base /Logged/
      # du counts a file once per call, so the nested folders get their own call
      - name: Site size
        run: du -sh dist && du -sh dist/data/pins dist/data/city && find dist -type f | wc -l
      # Pages rejects a site over 1 GB. Packs store osm.geojson / depressions.json gzipped
      # (scripts/lib/pack-files.mjs): all 117 take about 240 MB; the plain-JSON layout was 968 MB.
      - name: Site size guard (950 MB)
        run: |
          bytes=$(du -sb dist | cut -f1)
          echo "dist: $((bytes / 1000000)) MB of the 950 MB guard"
          if [ "$bytes" -gt 950000000 ]; then
            echo "::error title=Site too large::dist is $((bytes / 1000000)) MB, over the 950 MB guard (GitHub Pages rejects sites over 1 GB). Packs should store osm.geojson.gz and depressions.json.gz, not the plain JSON (scripts/lib/pack-files.mjs); largest packs: $(du -s dist/data/pins/*/ | sort -rn | head -3 | awk '{printf "%s %d MB; ", $2, $1/1024}')"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

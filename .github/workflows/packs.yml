# Builds every Bengaluru Urban pincode pack and uploads them as a workflow artifact
# (to publish as a release asset or a static host; see README "Hosting the packs").
# Manual only: it streams the ~95 GB OSM planet from AWS Open Data once (~20-40 min).
name: Build pincode packs
on:
  workflow_dispatch:
    inputs:
      pins:
        description: 'Comma-separated pincodes (empty = all)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: npm ci
      - run: npm run data:osm
      - run: npm run data:city
      - run: npm run data:all -- --jobs 2 ${{ inputs.pins && format('--pins {0}', inputs.pins) || '' }}
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: pincode-packs
          path: |
            public/data/pins
            public/data/city
          retention-days: 30

# Fast checks for every pull request and every push to a branch other than main: type check, unit
# tests, a production build and a browser smoke test (scripts/smoke.mjs) of that build on the committed
# packs (city overview, 560034, 560071, 560098). No pack builds: pages.yml does those when it deploys.
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
# A running check finishes; only the newest waiting one is kept. Several agents push to one branch
# every few minutes, and cancelling in progress meant hardly any run ever reached the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
      # Playwright's headless Chromium shell and the system libraries it needs
      - run: npx playwright-core install --with-deps --only-shell chromium
      # --no-tiles: the runner draws WebGL in software, and third-party basemap and terrain tiles were
      # most of that work (the predictions, the app's own layers and the fallback style still run)
      - run: npm run smoke -- --no-tiles --out "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

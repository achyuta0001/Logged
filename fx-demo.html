<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water FX Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04070d; color: #cfe3f7; font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
      #map { position: absolute; inset: 0; }
      .hud { position: absolute; left: 16px; top: 16px; z-index: 5; width: 280px; padding: 14px 16px; border-radius: 12px;
        background: rgba(6, 12, 22, 0.78); border: 1px solid rgba(110, 180, 255, 0.18); backdrop-filter: blur(8px); }
      .hud h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; color: #7fd8ff; }
      .hud label { display: flex; justify-content: space-between; margin-top: 10px; color: #9fb6cf; }
      .hud input[type=range] { width: 100%; accent-color: #1ec8ff; }
      .hud button { margin-top: 10px; background: #0f2a44; color: #cfe3f7; border: 1px solid #24527d; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      .stats { margin-top: 10px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: #7f97b2; white-space: pre; }
      @media (max-width: 480px) { .hud { left: 16px; right: 16px; width: auto; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="hud">
      <h1>Water FX demo · 560098</h1>
      <label>Sim hour <b id="hourv">0</b></label>
      <input id="hour" type="range" min="0" max="36" step="0.1" value="14" />
      <label>Rain (mm/hr) <b id="rainv">0</b></label>
      <input id="rain" type="range" min="0" max="120" step="1" value="65" />
      <button id="play">Pause</button>
      <div class="stats" id="stats"></div>
    </div>
    <script type="module" src="/src/map/fxDemo.ts"></script>
  </body>
</html>
